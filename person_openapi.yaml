openapi: 3.0.1
info:
  title: Person
  version: 0.1.0
servers:
- url: "{server}:{port}/person"
  variables:
    server:
      default: http://localhost
    port:
      default: "8080"
paths:
  /hamtaTokenAndGUIDAndPerson:
    get:
      operationId: getHamtatokenandguidandperson
      parameters:
      - name: personNr
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /checkEnv:
    get:
      operationId: getCheckenv
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
  /hamtaPerson:
    get:
      operationId: getHamtaperson
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /skapaPerson:
    post:
      operationId: postSkapaperson
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/person'
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /hamtaAllaPersonerSortByIdAsc:
    get:
      operationId: getHamtaallapersonersortbyidasc
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
  /hamtaAllaPersonerSortByEfternamnAsc:
    get:
      operationId: getHamtaallapersonersortbyefternamnasc
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
  /uppdateraPerson:
    put:
      operationId: putUppdateraperson
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/person'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /tabortPerson:
    delete:
      operationId: deleteTabortperson
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /hamtaPersonByPersonnummer:
    get:
      operationId: getHamtapersonbypersonnummer
      parameters:
      - name: idBet
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
components:
  schemas:
    ErrorPayload:
      required:
      - message
      - method
      - path
      - reason
      - status
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int64
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
    person:
      required:
      - efternamn
      - epostadress
      - fornamn
      - idbet
      - land
      - lastevent
      - merkontakt
      - mobilnr
      - motpart
      - motpartid
      - organisation
      - postnr
      - postort
      - skapaddatum
      - telnr
      - typavidbet
      - uppdateraddatum
      - utdelningsadress1
      type: object
      properties:
        id:
          type: integer
          format: int64
        utdelningsadress1:
          type: string
          nullable: true
        postnr:
          type: string
          nullable: true
        postort:
          type: string
          nullable: true
        fornamn:
          type: string
          nullable: true
        efternamn:
          type: string
          nullable: true
        typavidbet:
          type: string
          nullable: true
        idbet:
          type: string
          nullable: true
        skapaddatum:
          type: string
          nullable: true
        uppdateraddatum:
          type: string
          nullable: true
        lastevent:
          type: string
          nullable: true
        motpart:
          type: string
          nullable: true
        organisation:
          type: string
          nullable: true
        motpartid:
          type: string
          nullable: true
        land:
          type: string
          nullable: true
        merkontakt:
          type: string
          nullable: true
        telnr:
          type: string
          nullable: true
        mobilnr:
          type: string
          nullable: true
        epostadress:
          type: string
          nullable: true
      additionalProperties: false
