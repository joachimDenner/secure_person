openapi: 3.0.0
info:
  title: Secure Person API
  version: 1.0.0
  description: API för att hantera krypterade personuppgifter med AES-kryptering

servers:
  - url: http://localhost:8081

paths:
  /secure_person/skapaKrypteradPerson:
    post:
      summary: Skapa en ny krypterad person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurePerson'
      responses:
        '200':
          description: Skapad person
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: integer
        '400':
          description: Fel vid skapande

  /secure_person/hamtaAllaKrypteradePersonerUtanNyckel:
    get:
      summary: Hämta alla krypterade personer utan secret key
      responses:
        '200':
          description: Lista med personer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecurePerson'

  /secure_person/krypteraEttInputVarde:
    get:
      summary: Kryptera ett värde med secret key
      parameters:
        - name: normaltVarde
          in: query
          required: true
          schema:
            type: string
        - name: secretKey
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Krypterat värde
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  encryptedValue:
                    type: string
                    nullable: true
                  errorMessage:
                    type: string
                    nullable: true

  /secure_person/dekrypteraEttInputVarde:
    get:
      summary: Dekryptera ett värde med secret key
      parameters:
        - name: krypteratVarde
          in: query
          required: true
          schema:
            type: string
        - name: secretKey
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dekrypterat värde
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  decryptedValue:
                    type: string
                    nullable: true
                  errorMessage:
                    type: string
                    nullable: true

components:
  schemas:
    SecurePerson:
      type: object
      properties:
        id:
          type: integer
        persnr:
          type: string
        krypterat_persnr:
          type: string
        fornamn:
          type: string
        krypterat_fornamn:
          type: string
        efternamn:
          type: string
        krypterat_efternamn:
          type: string
        secret_key:
          type: string
        skapad:
          type: string
        uppdaterad:
          type: string
